<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1b2e" />
    <meta
      name="description"
      content="Portfólio 3D interativo de Pedro Victor: explore o quarto, veja projetos e converse comigo."
    />
    <meta property="og:title" content="Pedro Victor · Portfólio 3D" />
    <meta
      property="og:description"
      content="Explore meu quarto em 3D, veja projetos e converse comigo."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Pedro Victor · Portfólio 3D</title>
  </head>
  <body>
    <canvas id="webgl" aria-label="Quarto 3D interativo"></canvas>

    <div id="loader" class="loader" role="status">
      <div class="loader__cat" aria-hidden="true"></div>
      <p data-i18n="loading">Arrumando o quarto…</p>
    </div>

    <header class="topbar">
      <div class="brand">
        <strong class="brand__name" id="brand-name">Pedro Victor</strong>
        <span class="brand__role" id="brand-role"></span>
      </div>
      <button class="lang-toggle" id="lang-toggle" type="button" data-i18n-aria="lang.aria">
        <span data-lang="pt">PT</span><span data-lang="en">EN</span>
      </button>
    </header>

    <p class="hint" id="hint" data-i18n="hint.desktop"></p>

    <nav class="dock" aria-label="Atalhos" data-i18n-aria="dock.aria">
      <button type="button" class="dock__btn" data-action="chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /></svg>
        <span data-i18n="dock.chat">Chat</span>
      </button>
      <button type="button" class="dock__btn" data-action="projects">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v9H5zM3 18h18" /></svg>
        <span data-i18n="dock.projects">Projetos</span>
      </button>
      <button type="button" class="dock__btn" data-action="cv">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3h9l3 3v15H6zM9 10h6M9 14h6M9 18h4" />
        </svg>
        <span data-i18n="dock.cv">CV</span>
      </button>
      <button type="button" class="dock__btn" data-action="wardrobe">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 6a2 2 0 1 1 2-2M12 6v2L3 14v2h18v-2l-9-6" />
        </svg>
        <span data-i18n="dock.wardrobe">Roupa</span>
      </button>
      <button type="button" class="dock__btn" data-action="github">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M9 19c-4 1.5-4-2-6-2.5m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"
          />
        </svg>
        <span>GitHub</span>
      </button>
      <button type="button" class="dock__btn" data-action="linkedin">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4h16v16H4zM8 10v6M8 7v.5M12 16v-6m0 2.5a2.5 2.5 0 0 1 5 0V16" />
        </svg>
        <span>LinkedIn</span>
      </button>
      <button type="button" class="dock__btn" data-action="instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4h16v16H4z" />
          <circle cx="12" cy="12" r="3.5" />
          <path d="M16.5 7.5h.01" />
        </svg>
        <span>Insta</span>
      </button>
    </nav>

    <div class="tooltip" id="tooltip" aria-hidden="true"></div>
    <div class="labels" id="labels" aria-hidden="true"></div>

    <aside class="chat sheet" id="chat" aria-hidden="true" data-i18n-aria="chat.aria">
      <header class="chat__header">
        <div class="chat__avatar" aria-hidden="true"></div>
        <div class="chat__who">
          <strong id="chat-name">Pedro Victor</strong>
          <small data-i18n="chat.status">online · responde rapidinho</small>
        </div>
        <button type="button" class="icon-btn" id="chat-close" data-i18n-aria="close">✕</button>
      </header>
      <div class="chat__log" id="chat-log" role="log" aria-live="polite"></div>
      <div class="chat__suggestions" id="chat-suggestions"></div>
      <form class="chat__form" id="chat-form" autocomplete="off">
        <label class="sr-only" for="chat-input" data-i18n="chat.placeholder">Pergunte algo</label>
        <input
          id="chat-input"
          name="message"
          maxlength="500"
          data-i18n-placeholder="chat.placeholder"
          enterkeyhint="send"
        />
        <button type="submit" class="chat__send" data-i18n-aria="chat.send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" /></svg>
        </button>
      </form>
    </aside>

    <aside class="sheet wardrobe" id="wardrobe" aria-hidden="true" aria-labelledby="wardrobe-title">
      <header class="sheet__header">
        <h2 class="sheet__title" id="wardrobe-title" data-i18n="wardrobe.title">Guarda-roupa</h2>
        <button type="button" class="icon-btn" id="wardrobe-close" data-i18n-aria="close">✕</button>
      </header>
      <div class="wardrobe__preview">
        <canvas id="wardrobe-preview" data-i18n-aria="wardrobe.preview"></canvas>
        <span class="wardrobe__hint" data-i18n="wardrobe.drag">Arraste para girar</span>
      </div>
      <div class="wr-tabs" id="wardrobe-tabs" role="tablist" data-i18n-aria="wardrobe.title"></div>
      <form class="wardrobe__body" id="wardrobe-body" role="tabpanel"></form>
      <footer class="wardrobe__footer">
        <button type="button" class="btn btn--ghost" id="wardrobe-reset" data-i18n="wardrobe.reset">
          Padrão
        </button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="wardrobe-cancel" data-i18n="wardrobe.cancel">
          Cancelar
        </button>
        <button type="button" class="btn btn--primary" id="wardrobe-save" data-i18n="wardrobe.save">
          Salvar
        </button>
      </footer>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="modal" id="modal" hidden>
      <div class="modal__backdrop" data-close></div>
      <section class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal__header">
          <h2 id="modal-title"></h2>
          <button type="button" class="icon-btn" data-close data-i18n-aria="close">✕</button>
        </header>
        <div class="modal__body" id="modal-body"></div>
      </section>
    </div>

    <noscript>Este portfólio precisa de JavaScript para mostrar o quarto 3D.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
